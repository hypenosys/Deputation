name: Quality
on:
  pull_request:
  push:
    branches: [master, develop, 'feature/**']
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate mechanics and world
        run: python tools/validate_mechanics.py
      - name: Validate narrative design and denial contracts
        run: python tools/validate_design.py
      - name: Replay six-cycle winning ghost step by step
        run: python -m tools.simulate_trace --trace data/world/simulation_trace.json
      - name: Replay expired-case counterfactual
        run: python -m tools.simulate_trace --trace data/world/simulation_trace_failure.json
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
